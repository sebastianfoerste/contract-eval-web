name: CI

# Cloudflare Workers Builds deploys every push to main, so a pull request must
# pass the full npm run check sequence, including the build and the local Worker
# API check, before it is merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run test:types

      - name: Unit and parity tests
        run: npm test

      - name: Build the Worker
        run: npm run build

      - name: Local Worker API check
        run: npm run test:api:local

name: CI

# Runs lint, types and Node tests on the read-only GitHub mirror. The production build
# and the local Worker API check run locally with npm run check; nothing is deployed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run test:types

      - name: Unit and parity tests
        run: npm test
